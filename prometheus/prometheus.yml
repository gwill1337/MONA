global:
  scrape_interval: 15s

scrape_configs:
  # Static list of physical PCs, equivalent to `externalPcExporters` in
  # values.yaml. Prefer managing devices via the Admin panel instead —
  # this is only useful for bulk-adding devices at startup.
  - job_name: 'static-exporters'
    static_configs:
      # - targets: ['10.0.0.8:9100']
      #   labels:
      #     job: 'pc-test'
      #     physical_pc: "true"

  # Dynamic list, pulled live from the API — devices added/removed via
  # the Admin panel or the API show up here automatically.
  - job_name: 'dynamic-exporters'
    http_sd_configs:
      - url: 'http://api:8000/api/prometheus/targets'
        refresh_interval: 30s
    relabel_configs:
      - target_label: physical_pc
        replacement: "true"