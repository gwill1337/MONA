---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.celeryWorker.replicas }}
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      automountServiceAccountToken: {{ .Values.celeryWorker.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.celeryWorker.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: Always
          securityContext:
            {{- toYaml .Values.celeryWorker.initContainerSecurityContext | nindent 12 }}
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
          command: ['sh', '-c']
          args:
            - |
              until nc -z -w 2 postgres {{ .Values.postgres.service.port }}; do
                echo "Waiting for PostgreSQL...";
                sleep 2;
              done;
              echo "PostgreSQL is available!"
      enableServiceLinks: false
      containers:
        - name: worker
          image: "{{ .Values.images.celery.repository }}:{{ .Values.images.celery.tag }}"
          # checkov:skip=CKV_K8S_15:
          imagePullPolicy: {{ .Values.images.celery.pullPolicy }}
          securityContext:
            {{- toYaml .Values.celeryWorker.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                {{- toYaml .Values.celeryWorker.livenessProbe.exec.command | nindent 16 }}
            initialDelaySeconds: {{ .Values.celeryWorker.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.celeryWorker.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.celeryWorker.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.celeryWorker.livenessProbe.failureThreshold }}
          readinessProbe:
            exec:
              command:
                {{- toYaml .Values.celeryWorker.readinessProbe.exec.command | nindent 16 }}
            initialDelaySeconds: {{ .Values.celeryWorker.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.celeryWorker.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.celeryWorker.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.celeryWorker.readinessProbe.failureThreshold }}
          command:
            {{- toYaml .Values.celeryWorker.command | nindent 12 }}
          env:
          
            - name: REDIS_URL
              value: {{ include "mona.redisUrl" . | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.auth.password | quote }}
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.service.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.db | quote }}
            - name: EXPORTERS
              value: "{{ range $i, $e := .Values.global.externalPcExporters }}{{ if $i }},{{ end }}{{ $e.jobName }}:{{ $e.host }}{{ end }}"
            - name: PROMETHEUS_URL
              value: "http://prometheus-main-metrics.{{ .Release.Namespace }}.svc:9090"
          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}