apiVersion: apps/v1
kind: Deployment
metadata:
  name: mona-react
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.react.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-react
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-react
    spec:
      automountServiceAccountToken: {{ .Values.react.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.react.podSecurityContext | nindent 8 }}
      containers:
        - name: react
          image: "{{ .Values.images.react.repository }}:{{ .Values.images.react.tag }}"
          imagePullPolicy: {{ .Values.images.react.pullPolicy }}
          ports:
            - containerPort: {{ .Values.react.service.targetPort }}
          livenessProbe:
            httpGet:
              path: {{ .Values.react.livenessProbe.httpGet.path }}
              port: {{ .Values.react.service.targetPort }}
            initialDelaySeconds: {{ .Values.react.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.react.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.react.livenessProbe.httpGet.path }}
              port: {{ .Values.react.service.targetPort }}
            initialDelaySeconds: {{ .Values.react.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.react.livenessProbe.periodSeconds }}

          securityContext:
            {{- toYaml .Values.react.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-run
              mountPath: /var/run/nginx
          resources:
            {{- toYaml .Values.react.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}

        - name: nginx-cache
          emptyDir: {}

        - name: nginx-run
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-react
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.react.service.type }}
  ports:
    - port: {{ .Values.react.service.port }}
      targetPort: {{ .Values.react.service.targetPort }}
      {{- if eq .Values.react.service.type "NodePort" }}
      nodePort: {{ .Values.react.service.nodePort }}
      {{- end }}
  selector:
    app: {{ .Release.Name }}-react