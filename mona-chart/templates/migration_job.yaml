{{- if and .Values.migration.enabled (not .Values.postgres.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app: mona-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: mona-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: {{ .Values.fastapi.automountServiceAccountToken }}
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.fastapi.podSecurityContext | nindent 8 }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.fastapi.initContainerSecurityContext | nindent 12 }}
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
          command: ['sh', '-c']
          args:
            - |
              until nc -z -w 2 postgres {{ .Values.postgres.service.port }}; do
                echo "Waiting for PostgreSQL...";
                sleep 2;
              done;
              echo "PostgreSQL is available!"
      {{- end }}
      containers:
        - name: alembic
          image: "{{ .Values.images.fastapi.repository }}:{{ .Values.images.fastapi.tag }}"
          imagePullPolicy: {{ .Values.images.fastapi.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          securityContext:
            {{- toYaml .Values.fastapi.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            {{- range $key, $val := .Values.fastapi.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.db | quote }}
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.service.port | quote }}
            {{- else }}
            - name: DATABASE_URL
              value: {{ .Values.postgres.external.url | quote }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}