---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.celeryBeat.replicas }}
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      automountServiceAccountToken: {{ .Values.celeryBeat.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.celeryBeat.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: Always
          securityContext:
            {{- toYaml .Values.celeryBeat.initContainerSecurityContext | nindent 12 }}
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
          command: ['sh', '-c']
          args:
            - |
              until nc -z -w 2 postgres {{ .Values.postgres.service.port }}; do
                echo "Waiting for PostgreSQL...";
                sleep 2;
              done;
              echo "PostgreSQL is available!"
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: "{{ .Values.images.celery.repository }}:{{ .Values.images.celery.tag }}"
          # checkov:skip=CKV_K8S_15:
          imagePullPolicy: {{ .Values.images.celery.pullPolicy }}
          securityContext:
            {{- toYaml .Values.celeryBeat.containerSecurityContext | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/celerybeat-schedule
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/celerybeat-schedule
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            {{- toYaml .Values.celeryBeat.command | nindent 12 }}
          env:
            - name: REDIS_URL
              value: {{ include "mona.redisUrl" . | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.auth.password | quote }}
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.service.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}