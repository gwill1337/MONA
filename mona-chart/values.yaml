---
global:
  namespace: mona
  # Metrics for physical PC: IP/hostname must be accessible FROM Prometheus POD (firewall, routing).
  # On the PC: node_exporter (or windows_exporter) listens on 0.0.0.0:port.
  externalPcExporters:
    # - host: "10.0.0.8"
    #   port: 9100
    #   jobName: "pc-test"

images:
  fastapi:
    repository: mona-fastapi
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  react:
    repository: mona-react
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  celery:
    repository: mona-celery
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: "16"
    digest: ""
    pullPolicy: Always
  redis:
    repository: redis
    tag: "7"
    digest: ""
    pullPolicy: Always
  prometheus:
    repository: prom/prometheus
    tag: "v3.12.0"
    digest: ""
    pullPolicy: Always

fastapi:
  replicas: 1
  automountServiceAccountToken: false
  env:
    ADMIN_USERNAMES: ""
    ADMIN_PASSWORDS: ""
    USER_USERNAMES: ""
    USER_PASSWORDS: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  initContainerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  service:
    type: NodePort
    port: 80
    targetPort: 8080
    nodePort: 30080
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

react:
  replicas: 1
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  service:
    type: NodePort
    port: 80
    targetPort: 8080
    nodePort: 30081
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

celeryWorker:
  replicas: 1
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  initContainerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  command: ["celery", "-A", "celery_conf.app", "worker", "--loglevel=info"]
  livenessProbe:
    exec:
      command: ["/bin/sh", "-c", "celery -A celery_conf.app inspect ping -d celery@$HOSTNAME --timeout 10"]
    initialDelaySeconds: 40
    periodSeconds: 60
    timeoutSeconds: 15
    failureThreshold: 3
  readinessProbe:
    exec:
      command: ["/bin/sh", "-c", "celery -A celery_conf.app inspect ping -d celery@$HOSTNAME --timeout 10"]
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 3
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

celeryBeat:
  replicas: 1
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  initContainerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  command: ["celery", "-A", "celery_conf.app", "beat", "--loglevel=info", "-s", "/tmp/celerybeat-schedule"]
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

postgres:
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
  service:
    port: 5432
  auth:
    user: myuser
    password: "1234"
    db: mydb
    # Backwards-compatible keys expected by templates
    username: myuser
    database: mydb
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

redis:
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  service:
    port: 6379
  persistence:
    enabled: true
    hostPath: /data/redisdata
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

prometheus:
  enabled: true
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  replicas: 1
  service:
    type: NodePort
    port: 9090
    targetPort: 9090
    nodePort: 30391
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

monitoring:
  enabled: true

ingress:
  enabled: false

kube-prometheus-stack:
  alertmanager:
    enabled: true
    templateFiles:
      telegram.tmpl: |
        {{ define "telegram.custom.message" }}
        {{ if eq .Status "firing" }} <b>ALERT: {{ .CommonLabels.alertname }}</b>{{ else }} <b>RECOVERED: {{ .CommonLabels.alertname }}</b>{{ end }}

        {{ range .Alerts }}
          <b>Device:</b> {{ .Labels.device }}
          <b>Reason:</b> {{ .Annotations.summary }}
          <b>Details:</b> {{ .Annotations.description }}
        {{ end }}
        {{ end }}
    config:
      global:
        resolve_timeout: 5m

      templates:
        - '/etc/alertmanager/config/*.tmpl'

      route:
        group_by: ['alertname', 'severity', 'device', 'reason']
        group_wait: 10s
        group_interval: 20s
        repeat_interval: 15m
        receiver: 'telegram'
        routes:
          - receiver: "null"
            matchers:
              - alertname =~ "Watchdog|InfoInhibitor|etcdInsufficientMembers"
          - receiver: "null"
            matchers:
              - namespace = "kube-system"
      receivers:
        - name: "null"
        - name: telegram
          telegram_configs:
            - bot_token: ""
              chat_id: ""
              send_resolved: true
              parse_mode: HTML
              message: '{{ template "telegram.custom.message" . }}'

  grafana:
    enabled: true
    service:
      type: NodePort
      nodePort: 30300
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: mona
        folder: /tmp/dashboards
    securityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    containerSecurityContext:
      runAsUser: 472
      runAsGroup: 472
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://mona-kube-prometheus-stack-prometheus.mona.svc:9090
            isDefault: false
          - name: Prometheus-PC
            type: prometheus
            access: proxy
            url: http://prometheus-main-metrics.mona.svc:9090
            isDefault: false
          - name: Loki
            type: loki
            access: proxy
            url: http://loki-stack:3100
            isDefault: false
            jsonData:
              maxLines: 1000
  prometheus:
    enabled: true
    service:
      type: NodePort
      nodePort: 30091
    prometheusSpec:
      # Отключаем привязку к helm-релизу
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
  # External node exporter for monitoring physical PC metrics.
  nodeExporter:
    enabled: true