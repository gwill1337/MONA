version: '3.8'

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mona

  # ─── Redis (celery broker + sessions/limiter storage) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: mona-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mona

  # ─── FastAPI ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.fastapi
    image: mona-fastapi:local
    container_name: mona-fastapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UV_NO_CACHE: "1"
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${database_url:-}
      REDIS_URL: ${redis_url:-redis://redis:6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:30081"]}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin}
      ADMIN_PASSWORDS: ${ADMIN_PASSWORDS:?set ADMIN_PASSWORDS in .env}
      USER_USERNAMES: ${USER_USERNAMES:-}
      USER_PASSWORDS: ${USER_PASSWORDS:-}
      MAX_ATTEMPTS: ${max_attempts:-5}
      LOCKOUT_SECONDS: ${lockout_seconds:-300}
      SESSION_TTL: ${session_ttl:-43200}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn mona_core.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "30080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mona

  # ─── MCP server (SSE) ───────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.mcp
    image: mona-mcp:local
    container_name: mona-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${database_url:-}
      REDIS_URL: ${redis_url:-redis://redis:6379}
      MONA_API_URL: http://api:8000
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "30082:8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mona

  # ─── Celery worker (metrics collection + ML training/inference) ───────
  celery-worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.celery
    image: mona-celery:local
    container_name: mona-celery-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${database_url:-}
      REDIS_URL: ${redis_url:-redis://redis:6379}
      PROMETHEUS_URL: http://prometheus:9090
      EXPORTERS: ${EXPORTERS:-}
      WINDOW: ${window:-500}
      MIN_POINTS: ${min_points:-30}
      CONTAMINATION: ${contamination:-0.05}
      SCORE_THRESHOLD: ${score_threshold:--0.05}
    command: celery -A mona_core.celery_conf worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A mona_core.celery_conf inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - mona

  # ─── Celery beat (schedules collect_and_save + detect_anomalies) ──────
  celery-beat:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.celery
    image: mona-celery:local
    container_name: mona-celery-beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${database_url:-}
      REDIS_URL: ${redis_url:-redis://redis:6379}
    command: celery -A mona_core.celery_conf beat --loglevel=info -s /tmp/celerybeat-schedule
    volumes:
      - celerybeat-tmp:/tmp
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mona

  # ─── React frontend ─────────────────────────────────────────────────
  react:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.react
    image: mona-react:local
    container_name: mona-react
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "30081:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run/nginx
    networks:
      - mona

  # ─── Prometheus — MONA'S OWN product monitoring (physical PCs) ────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mona-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "30391:9090"
    depends_on:
      - api
    networks:
      - mona

volumes:
  pgdata:
    name: mona_pgdata_prod
  redisdata:
    name: mona_redisdata_prod
  prometheus-data:
  celerybeat-tmp:

networks:
  mona:
    driver: bridge