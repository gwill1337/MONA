name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  secret_scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  security_iac:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: [terraform, helm]
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (Terraform & Helm)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,helm
          quiet: true
  
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform

  helm:
    name: Helm checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./mona-chart
            
  yaml_lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: |
            mona-chart/values.yaml
            mona-chart/values-prod.yaml
            mona-chart/Chart.yaml
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              braces:
                min-spaces-inside: 0
                max-spaces-inside: 1
              document-start: disable
              new-line-at-end-of-file: disable

  python:
    name: Python lint, type checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group ci

      - name: Mypy type check
        run: uv run mypy mona_core/

      - name: Ruff lint
        run: uv run ruff check mona_core/

      - name: Ruff format check
        run: uv run ruff format --check mona_core/
      
      - name: pytest
        run: uv run pytest tests/

  docker_build_and_scan:
    name: Build and Scan Docker Images Locally
    runs-on: ubuntu-latest
    needs: [terraform, helm, yaml_lint, python, security_iac]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          # Собираем образы с локальными тегами для проверки
          docker build -f docker/dockerfile.celery -t local/celery:test .
          docker build -f docker/dockerfile.fastapi -t local/fastapi:test .
          docker build -f docker/dockerfile.react -t local/react:test .

      - name: Scan FastAPI image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/fastapi:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Scan Celery image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/celery:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Scan React image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/react:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'