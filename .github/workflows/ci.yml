name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  secret_scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  security_iac:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: [terraform, helm]
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (Terraform & Helm)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,helm
          quiet: true
  
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform

  helm:
    name: Helm checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./mona-chart

      # - name: Setup kubeconform
      #   run: |
      #     curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
      #     sudo mv kubeconform /usr/local/bin/

      # - name: Kubeconform
      #   run: |
      #     helm template ./mona-chart | kubeconform \
      #       -kubernetes-version 1.28.0 \
      #       -ignore-missing-schemas \
      #       -skip Prometheus,Alertmanager,ServiceMonitor,PodMonitor,GrafanaDashboard \
      #       -summary \
      #       -output pretty \
      #       -
            
  yaml_lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: |
            mona-chart/values.yaml
            mona-chart/values-prod.yaml
            mona-chart/Chart.yaml
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              braces:
                min-spaces-inside: 0
                max-spaces-inside: 1
              document-start: disable
              new-line-at-end-of-file: disable

  python:
    name: Python lint, type checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group ci

      - name: Mypy type check
        run: uv run mypy mona_core/

      - name: Ruff lint
        run: uv run ruff check mona_core/

      - name: Ruff format check
        run: uv run ruff format --check mona_core/
      
      - name: pytest
        run: uv run pytest tests/

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [terraform, helm, yaml_lint, python, security_iac]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -f docker/dockerfile.celery -t ${{ secrets.DOCKER_IMAGE_CELERY }} .
          docker build -f docker/dockerfile.fastapi -t ${{ secrets.DOCKER_IMAGE_FASTAPI }} .
          docker build -f docker/dockerfile.react -t ${{ secrets.DOCKER_IMAGE_REACT }} .

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_IMAGE_CELERY }}
          docker push ${{ secrets.DOCKER_IMAGE_FASTAPI }}
          docker push ${{ secrets.DOCKER_IMAGE_REACT }}
  
  security_scan:
    name: Trivy
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Scan FastAPI image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_IMAGE_FASTAPI }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Scan Celery image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_IMAGE_CELERY }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Scan React image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_IMAGE_REACT }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'